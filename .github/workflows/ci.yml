name: CI

on:
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  STELLAR_CLI_VERSION: "26.0.0"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the comment.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins Rust and adds rustfmt, clippy and wasm32v1-none.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Prebuilt release binary, checked against the release's build attestation
      # by the action. The action is pinned to the commit of the v26.0.0 tag.
      # Pinned by SHA, the action cannot read the version from its ref, so the
      # version is passed explicitly.
      - name: Install stellar-cli
        uses: stellar/stellar-cli@60f7458e7ecffddf2f2d91dc6d0d2db4fab03ecc # v26.0.0
        with:
          version: ${{ env.STELLAR_CLI_VERSION }}

      # The cache key includes the Rust version and hashes of Cargo.lock,
      # Cargo.toml and rust-toolchain.toml.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Print tool versions
        run: |
          stellar --version
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build contracts to WASM
        run: stellar contract build
